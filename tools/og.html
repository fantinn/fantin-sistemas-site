<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Imagem de compartilhamento</title>
<!-- Fonte da imagem og.png (1200x630). Para gerar de novo:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=og.png http://127.0.0.1:8082/tools/og.html
     (com o site servido na porta 8082) -->
<link rel="stylesheet" href="../style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding: var(--s-6);
    background: var(--papel);
  }
  .og h1 { font-size: calc(var(--t-3xl) * 1.45); max-width: 20ch; }
  .og .lead { margin-top: var(--s-3); font-size: var(--t-xl); max-width: 48ch; }
  .og .hero-meta { margin-top: var(--s-4); font-size: var(--t-lg); padding-top: var(--s-3); border-top: var(--borda) solid var(--linha); }
  .og .brand { margin: 0 0 var(--s-3); }
</style>
</head>
<body>
<div class="og">
    <p class="brand">
      <svg width="20" height="24" viewBox="0 0 22 26" aria-hidden="true"><g fill="currentColor">
        <rect x="0" y="0" width="3" height="26"/><rect x="0" y="0" width="7" height="3"/><rect x="0" y="23" width="7" height="3"/>
        <rect x="19" y="0" width="3" height="26"/><rect x="15" y="0" width="7" height="3"/><rect x="15" y="23" width="7" height="3"/>
        <rect x="11" y="15" width="8" height="8"/></g></svg>
      <span class="brand-nome">FANTIN</span> <span class="brand-sub">Sistemas</span>
    </p>
    <h1>Seu cliente te acha no Instagram e não tem onde <span class="destaque">comprar.</span></h1>
    <p class="lead">Eu monto a loja onde ele vê o preço, escolhe e paga sozinho, no Pix ou no cartão.</p>
</div>
</body>
</html>
